<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .chat-container {
            width: 90%;
            max-width: 700px;
            height: 80vh;

            background: white;
            border-radius: 15px;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .header {
            padding: 20px;
            background: #222;
            color: white;
            text-align: center;
        }

        .messages {
            flex: 1;
            padding: 20px;

            overflow-y: auto;

            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;

            white-space: pre-wrap;
        }

        .user {
            align-self: flex-end;
            background: #222;
            color: white;
        }

        .bot {
            align-self: flex-start;
            background: #e9e9e9;
            color: black;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;
        }

        button {
            padding: 12px 20px;

            border: none;
            border-radius: 8px;

            background: #222;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="header">
            <h2>My AI Chatbot</h2>
        </div>

        <div id="messages" class="messages"></div>

        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Ask something..."
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>


    <script>

        const input = document.getElementById("messageInput");
        const messages = document.getElementById("messages");


        function addMessage(text, type) {

            const message = document.createElement("div");

            message.classList.add("message");
            message.classList.add(type);

            message.textContent = text;

            messages.appendChild(message);

            messages.scrollTop = messages.scrollHeight;
        }


        async function sendMessage() {

            const text = input.value.trim();

            if (!text) {
                return;
            }

            // Show user's message
            addMessage(text, "user");

            // Clear input
            input.value = "";

            // Temporary loading message
            addMessage("Thinking...", "bot");

            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })

                });


                if (!response.ok) {
                    throw new Error("Server error");
                }


                const data = await response.json();


                // Remove "Thinking..."
                messages.lastChild.remove();


                // Show AI response
                addMessage(data.answer, "bot");


            } catch (error) {

                messages.lastChild.remove();

                addMessage(
                    "Something went wrong. Check the server.",
                    "bot"
                );

                console.error(error);
            }
        }


        // Press Enter to send
        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        });

    </script>

</body>

</html>
